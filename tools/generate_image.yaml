identity:
  name: generate_image
  author: treza-labs
  label:
    en_US: Generate an Image
description:
  human:
    en_US: Makes a picture from a prompt. Treza quotes the price first, and stops if it is over a Max cost you set.
  llm: Generates one AI picture from a text prompt and returns a link to the image file. The cost comes out of the Treza account credits, up to the cap the user set.
parameters:
- name: prompt
  type: string
  required: true
  form: llm
  label:
    en_US: Prompt
  human_description:
    en_US: What the picture shows.
  llm_description: 'A description of the picture to generate: the subject, setting, style and lighting.'
- name: max_cost_usd
  type: number
  required: false
  form: form
  label:
    en_US: Max cost (USD)
  human_description:
    en_US: Optional. The most this step may spend. Treza quotes the price first. If it is higher, the step stops and nothing is spent. Leave empty for no limit.
  llm_description: An optional spending cap in US dollars, set by the user.
  min: 0.01
- name: aspect_ratio
  type: select
  required: false
  form: llm
  label:
    en_US: Shape
  human_description:
    en_US: Leave empty to let the model choose.
  llm_description: The picture shape as an aspect ratio. Leave out for square.
  options:
  - value: '1:1'
    label:
      en_US: '1:1'
  - value: '16:9'
    label:
      en_US: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
  - value: '4:5'
    label:
      en_US: '4:5'
  - value: '3:4'
    label:
      en_US: '3:4'
  - value: '4:3'
    label:
      en_US: '4:3'
  - value: '2:3'
    label:
      en_US: '2:3'
  - value: '3:2'
    label:
      en_US: '3:2'
- name: model
  type: string
  required: false
  form: form
  label:
    en_US: Model
  human_description:
    en_US: A model ID from Treza's model list, for example google/gemini-2.5-flash-image. Leave empty for Treza's default.
  llm_description: Optional Treza model ID.
- name: name
  type: string
  required: false
  form: form
  label:
    en_US: Name
  human_description:
    en_US: What to call the render in Treza.
  llm_description: A short name for the render in Treza.
- name: wait_seconds
  type: number
  required: false
  form: form
  label:
    en_US: Wait (seconds)
  human_description:
    en_US: How long to wait for the picture. Most are ready in under 30 seconds.
  llm_description: How long to wait for the render before returning.
  default: 120
  min: 0
  max: 540
output_schema:
  type: object
  properties:
    url:
      type: string
      description: Link to the finished file. Empty while the render is still running.
    status:
      type: string
      description: running, success, partial, error or cancelled.
    finished:
      type: boolean
      description: True once the render is done.
    price_usd:
      type: number
      description: What Treza quoted for the render, in US dollars.
    model:
      type: string
      description: The model that made it.
    run_id:
      type: string
      description: The run ID, for Check a Render.
    pipeline_id:
      type: string
      description: The pipeline ID, for Check a Render.
extra:
  python:
    source: tools/generate_image.py
